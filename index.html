<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Fox Hill Run: a fox runs through the hills from morning to starlight.">
<title>Fox Hill Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700&display=swap">
<style>
/* Layout: full-bleed canvas landscape; small cream HUD chips float over the sky, cards centre over the scene */
:root{
  --ink:#24301f;
  --cream:#fff8ec;
  --panel:rgba(255,248,236,.93);
  --fox:#d2621f;
  --leaf:#3d7a33;
  --shadow:rgba(24,36,22,.28);
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:#b8def0;}
body{font-family:var(--body);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
#game{position:fixed;inset:0;}
#c{display:block;width:100%;height:100%;touch-action:none;}
.hud{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));right:calc(14px + env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;pointer-events:none;}
.group{display:flex;gap:8px;align-items:center;}
.chip{background:var(--panel);color:var(--ink);border-radius:999px;padding:7px 14px;font-family:var(--display);font-weight:600;font-size:18px;line-height:1;box-shadow:0 2px 10px var(--shadow);display:flex;gap:14px;align-items:baseline;font-variant-numeric:tabular-nums;}
.chip small{font-family:var(--body);font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.62;font-weight:700;margin-right:5px;}
.btn-icon{pointer-events:auto;border:0;background:var(--panel);color:var(--ink);border-radius:999px;width:36px;height:36px;font-family:var(--display);font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 2px 10px var(--shadow);display:grid;place-items:center;}
.btn-icon[aria-pressed="true"]{opacity:.55;text-decoration:line-through;}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));}
.card{background:var(--panel);color:var(--ink);border-radius:24px;padding:26px 28px 22px;max-width:360px;width:100%;box-sizing:border-box;text-align:center;box-shadow:0 14px 40px var(--shadow);}
.card h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,8vw,46px);line-height:1;margin:0;color:var(--fox);text-wrap:balance;}
.card h2{font-family:var(--display);font-weight:600;font-size:28px;margin:0;color:var(--fox);}
.card p{margin:12px 0 0;line-height:1.5;font-size:15px;}
.card .keys{font-size:13px;opacity:.7;margin-top:14px;}
.play{margin-top:18px;font-family:var(--display);font-size:20px;font-weight:600;border:0;border-radius:999px;padding:12px 30px;background:var(--leaf);color:#fff;cursor:pointer;box-shadow:0 4px 0 #2a5823;}
.play:active{transform:translateY(2px);box-shadow:0 2px 0 #2a5823;}
.play:focus-visible,.btn-icon:focus-visible{outline:3px solid var(--fox);outline-offset:3px;}
.stats{display:flex;justify-content:center;gap:26px;margin-top:16px;font-family:var(--display);font-variant-numeric:tabular-nums;}
.stats div{display:flex;flex-direction:column;align-items:center;gap:2px;}
.stats b{font-size:30px;font-weight:600;line-height:1;}
.stats span{font-family:var(--body);font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.62;font-weight:700;}
.newbest{display:inline-block;margin-top:12px;background:var(--fox);color:#fff;border-radius:999px;padding:4px 12px;font-family:var(--display);font-size:14px;font-weight:600;}
@media (max-width:420px){.chip{font-size:16px;padding:6px 11px;gap:10px}.btn-icon{width:32px;height:32px}}
</style>
</head>
<body>
<div id="game">
  <canvas id="c" aria-label="A fox running through hills"></canvas>
  <div class="hud">
    <div class="chip"><span><small>Score</small><span id="score">0</span></span><span><small>Berries</small><span id="berries">0</span></span></div>
    <div class="group">
      <div class="chip"><span><small>Best</small><span id="best">0</span></span></div>
      <button class="btn-icon" id="mute" type="button" aria-label="Sound" aria-pressed="false" title="Sound (M)">&#9835;</button>
      <button class="btn-icon" id="pause" type="button" aria-label="Pause" title="Pause (P)">II</button>
    </div>
  </div>
  <div class="overlay" id="start">
    <div class="card">
      <h1>Fox Hill Run</h1>
      <p>Run through the hills from morning sun to starlight. Jump the logs, rocks and stumps, and pick up berries on the way.</p>
      <button class="play" id="playBtn" type="button">Start running</button>
      <p class="keys">Space, &uarr; or tap to jump. Hold for a higher jump.</p>
    </div>
  </div>
  <div class="overlay" id="over" hidden>
    <div class="card">
      <h2 id="overMsg">Tripped on a log</h2>
      <div class="stats">
        <div><b id="oScore">0</b><span>Score</span></div>
        <div><b id="oBerries">0</b><span>Berries</span></div>
        <div><b id="oBest">0</b><span>Best</span></div>
      </div>
      <div id="newBest" class="newbest" hidden>New best!</div>
      <div><button class="play" id="againBtn" type="button">Run again</button></div>
      <p class="keys">or press Space</p>
    </div>
  </div>
  <div class="overlay" id="paused" hidden>
    <div class="card">
      <h2>Paused</h2>
      <button class="play" id="resumeBtn" type="button">Keep running</button>
    </div>
  </div>
</div>
<script>
(() => {
  "use strict";
  const cv = document.getElementById("c");
  const ctx = cv.getContext("2d");
  const $ = (id) => document.getElementById(id);
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- sizing: a virtual world ~540 units tall, scaled to the screen ----------
  let W = 0, H = 0, VW = 0, VH = 0, S = 1, DPR = 1, GY = 0;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    S = Math.min(H / 540, W / 520);
    VW = W / S; VH = H / S;
    GY = VH - Math.max(88, VH * 0.17);
    fox.x = Math.max(92, Math.min(VW * 0.2, 220));
  }

  // ---------- colour helpers ----------
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const rgb = (a, al) => al === undefined ? `rgb(${a[0] | 0},${a[1] | 0},${a[2] | 0})` : `rgba(${a[0] | 0},${a[1] | 0},${a[2] | 0},${al})`;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const smooth = (t) => t * t * (3 - 2 * t);
  const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  const rand = (a, b) => a + Math.random() * (b - a);

  // Palettes for the time of day
  const KEYS = ["skyT", "skyB", "far", "far2", "hill", "ridge", "tree", "grass", "grassD", "dirt", "cloud"];
  const PAL = {
    day:    ["#3f86d1", "#bfe2f2", "#93abc6", "#7896ae", "#6fa05a", "#4f7f40", "#2f5f34", "#68a944", "#4b8a32", "#8a5a35", "#ffffff"],
    sunset: ["#38407c", "#f7a75e", "#8c7092", "#785d7f", "#6c6c49", "#4b5336", "#2e3a28", "#708b3b", "#566f2d", "#6e4529", "#ffd3b1"],
    night:  ["#081329", "#1f3459", "#283a5e", "#1f2d4c", "#1e3b38", "#173029", "#0e2120", "#2b4e34", "#1f3f29", "#3a2a22", "#4a5574"],
    dawn:   ["#4e66a8", "#f4b9a3", "#8e94b9", "#7c81a9", "#5f8b62", "#45704a", "#2a4d36", "#5d9b4a", "#467d38", "#7a5134", "#ffe2d7"],
  };
  for (const k in PAL) PAL[k] = PAL[k].map(hex);
  const FRAMES = [[0, "day"], [0.17, "day"], [0.25, "sunset"], [0.33, "night"], [0.67, "night"], [0.75, "dawn"], [0.83, "day"], [1, "day"]];
  const pal = {};
  function updatePalette(p) {
    let i = 0;
    while (i < FRAMES.length - 2 && p > FRAMES[i + 1][0]) i++;
    const [p0, a] = FRAMES[i], [p1, b] = FRAMES[i + 1];
    const t = smooth(clamp((p - p0) / (p1 - p0 || 1), 0, 1));
    KEYS.forEach((k, j) => { pal[k] = mix(PAL[a][j], PAL[b][j], t); });
  }
  const NIGHT_TINT = hex("#1b2547");
  let night = 0;
  const cache = new Map();
  const sh = (h, extra = 0) => { let c = cache.get(h); if (!c) { c = hex(h); cache.set(h, c); } return rgb(mix(c, NIGHT_TINT, clamp(night * 0.5 + extra, 0, 1))); };

  // ---------- game state ----------
  const GRAV = 2700, JUMP = 930;
  const fox = { x: 110, y: 0, vy: 0, ground: true, hold: 0, run: 0, squash: 0 };
  const st = { mode: "ready", dist: 0, run: 0, speed: 380, time: 0, berries: 0, score: 0, best: 0, p: 0.06, shake: 0, overAt: 0, buffer: 0 };
  let obstacles = [], berries = [], parts = [];
  let nextObs = 700, nextBerry = 1100, input = false, cause = "log";

  try { st.best = parseInt(localStorage.getItem("foxhillrun.best") || "0", 10) || 0; } catch (e) { st.best = 0; }
  $("best").textContent = st.best;

  // Scenery fixtures
  const stars = Array.from({ length: 140 }, (_, i) => ({ x: hash(i + 1), y: hash(i + 77) * 0.62, r: 0.5 + hash(i + 5) * 1.3, tw: hash(i + 9) * 6.28 }));
  const clouds = Array.from({ length: 8 }, (_, i) => ({ x: hash(i + 200) * 1600, y: 0.08 + hash(i + 210) * 0.32, s: 0.6 + hash(i + 220) * 0.9 }));
  const birds = Array.from({ length: 5 }, (_, i) => ({ x: hash(i + 300) * 900, y: 0.14 + hash(i + 310) * 0.22, ph: hash(i + 320) * 6 }));
  const flies = Array.from({ length: 18 }, (_, i) => ({ x: hash(i + 400), y: hash(i + 410), ph: hash(i + 420) * 6.28, sp: 0.6 + hash(i + 430) }));

  const LAYERS = {
    far:   { f: 0.05, base: -215, w: [[85, 0.0019, 0.3, 1], [38, 0.0051, 1.7, 1], [12, 0.014, 4, 0]] },
    far2:  { f: 0.13, base: -140, w: [[60, 0.0029, 2.1, 1], [22, 0.0075, 0.4, 0], [8, 0.02, 3, 0]] },
    hill:  { f: 0.27, base: -70,  w: [[36, 0.0042, 1.2, 0], [18, 0.011, 2.6, 0]] },
    ridge: { f: 0.5,  base: -22,  w: [[16, 0.006, 0.5, 0], [8, 0.017, 3.3, 0]] },
  };
  function ry(L, wx) {
    let y = GY + L.base;
    for (const [a, fr, ph, rd] of L.w) { const s = Math.sin(wx * fr + ph); y -= a * (rd ? 1 - Math.abs(s) : s * 0.5 + 0.5); }
    return y;
  }

  // ---------- sound ----------
  let ac = null, muted = false;
  function tone(f1, f2, dur, type = "sine", vol = 0.1) {
    if (muted) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) { /* audio unavailable */ }
  }

  // ---------- flow ----------
  function show(id) { ["start", "over", "paused"].forEach((o) => { $(o).hidden = o !== id; }); }
  function startRun() {
    obstacles = []; berries = []; parts = [];
    Object.assign(st, { mode: "play", run: 0, speed: 380, time: 0, berries: 0, score: 0, p: 0.06, shake: 0, buffer: 0 });
    Object.assign(fox, { y: 0, vy: 0, ground: true, hold: 0, squash: 0 });
    nextObs = 650; nextBerry = 1000;
    show(null); updateHud(true);
    cv.focus && cv.blur();
  }
  function gameOver() {
    st.mode = "over"; st.overAt = performance.now(); st.shake = reduceMotion ? 0 : 14;
    tone(240, 55, 0.4, "sawtooth", 0.09);
    burst(fox.x + 10, GY + fox.y - 22, 18, ["#e07a3a", "#f6e7d0", "#a9471c"], 260);
    const isBest = st.score > st.best;
    if (isBest) { st.best = st.score; try { localStorage.setItem("foxhillrun.best", String(st.best)); } catch (e) {} }
    const msgs = { log: "Tripped on a log", rock: "Bumped a rock", stump: "Stubbed on a stump" };
    $("overMsg").textContent = msgs[cause] || "Ouch!";
    $("oScore").textContent = st.score; $("oBerries").textContent = st.berries; $("oBest").textContent = st.best;
    $("best").textContent = st.best; $("newBest").hidden = !isBest;
    setTimeout(() => { if (st.mode === "over") show("over"); }, 650);
  }
  function setPaused(on) {
    if (on && st.mode === "play") { st.mode = "paused"; show("paused"); }
    else if (!on && st.mode === "paused") { st.mode = "play"; show(null); last = performance.now(); }
  }
  function press() {
    input = true;
    if (st.mode === "ready") { startRun(); return; }
    if (st.mode === "over") { if (performance.now() - st.overAt > 700) startRun(); return; }
    if (st.mode === "paused") { setPaused(false); return; }
    if (fox.ground) jump(); else st.buffer = 0.13;
  }
  function release() { input = false; }
  function jump() {
    fox.vy = -JUMP; fox.ground = false; fox.hold = 0; st.buffer = 0;
    tone(380, 760, 0.14, "triangle", 0.08);
    burst(fox.x - 6, GY, 5, ["#b98a5c", "#d8b48a"], 90, true);
  }

  // ---------- particles ----------
  function burst(x, y, n, cols, spd, dust) {
    for (let i = 0; i < n; i++) {
      const a = dust ? rand(Math.PI * 1.05, Math.PI * 1.6) : rand(0, Math.PI * 2);
      const v = rand(spd * 0.35, spd);
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: rand(0.35, 0.7), r: rand(1.5, 3.6), c: cols[i % cols.length], g: dust ? 300 : 500 });
    }
  }

  // ---------- spawning ----------
  function spawnObstacle() {
    const r = Math.random();
    const type = r < 0.42 ? "log" : r < 0.75 ? "rock" : "stump";
    const k = rand(0.85, 1.15);
    const dims = { log: [74, 30], rock: [50, 38], stump: [36, 56] }[type];
    obstacles.push({ type, x: VW + 40, w: dims[0] * k, h: dims[1] * (type === "stump" ? Math.min(k, 1.05) : k), seed: Math.random() * 100 });
  }
  function spawnBerries() {
    const n = 3 + ((Math.random() * 3) | 0);
    const h0 = rand(30, 150), kind = Math.random() < 0.5 ? "rasp" : "blue";
    for (let i = 0; i < n; i++) {
      berries.push({ x: VW + 40 + i * 34, h: h0 + Math.sin((i / (n - 1)) * Math.PI) * 34, kind, ph: i * 0.7, got: false });
    }
  }

  // ---------- update ----------
  function update(dt) {
    fox.squash = Math.max(0, fox.squash - dt * 5);
    st.shake = Math.max(0, st.shake - dt * 40);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.life += dt;
      if (p.life >= p.max) { parts.splice(i, 1); continue; }
      p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    }
    if (st.mode === "ready") { st.dist += 110 * dt; fox.run += dt * 6; return; }
    if (st.mode !== "play") return;

    st.time += dt;
    st.speed = Math.min(930, 380 + st.time * 9);
    const dx = st.speed * dt;
    st.dist += dx; st.run += dx;
    st.p = (0.06 + st.run / 36000) % 1;

    // fox physics: holding the jump softens gravity while rising
    let g = GRAV;
    if (input && fox.vy < 0 && fox.hold < 0.26) { fox.hold += dt; g = GRAV * 0.42; }
    fox.vy += g * dt; fox.y += fox.vy * dt;
    if (fox.y >= 0) {
      if (!fox.ground) { fox.squash = 1; burst(fox.x, GY, 6, ["#b98a5c", "#d8b48a"], 110, true); }
      fox.y = 0; fox.vy = 0; fox.ground = true;
      if (st.buffer > 0) jump();
    }
    st.buffer = Math.max(0, st.buffer - dt);
    fox.run += dt * (st.speed / 38);

    // spawn
    nextObs -= dx;
    if (nextObs <= 0) { spawnObstacle(); nextObs = rand(st.speed * 0.78, st.speed * 1.75) + 120; }
    nextBerry -= dx;
    if (nextBerry <= 0) { spawnBerries(); nextBerry = rand(900, 1900); }

    // move + collide
    const fx0 = fox.x - 18, fx1 = fox.x + 34, fy1 = GY + fox.y - 6, fy0 = GY + fox.y - 44;
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i]; o.x -= dx;
      if (o.x + o.w < -60) { obstacles.splice(i, 1); continue; }
      const ox0 = o.x + 7, ox1 = o.x + o.w - 7, oy0 = GY - o.h + 6;
      if (fx1 > ox0 && fx0 < ox1 && fy1 > oy0 && fy0 < GY) { cause = o.type; gameOver(); return; }
    }
    for (let i = berries.length - 1; i >= 0; i--) {
      const b = berries[i]; b.x -= dx;
      if (b.x < -40) { berries.splice(i, 1); continue; }
      const by = GY - b.h + Math.sin(st.time * 4 + b.ph) * 3;
      if (b.x > fx0 - 10 && b.x < fx1 + 10 && by > fy0 - 12 && by < fy1 + 10) {
        berries.splice(i, 1); st.berries++;
        tone(880, 1400, 0.09, "sine", 0.07);
        burst(b.x, by, 9, b.kind === "rasp" ? ["#ff6b7f", "#ffd1d8", "#ffe9a8"] : ["#7f93ff", "#d6deff", "#ffe9a8"], 150);
      }
    }
    st.score = Math.floor(st.run / 25) + st.berries * 10;
    updateHud();
  }

  let hudScore = -1, hudBerries = -1;
  function updateHud(force) {
    if (force || st.score !== hudScore) { $("score").textContent = st.score; hudScore = st.score; }
    if (force || st.berries !== hudBerries) { $("berries").textContent = st.berries; hudBerries = st.berries; }
  }

  // ---------- drawing ----------
  function drawSky(t) {
    const g = ctx.createLinearGradient(0, 0, 0, GY);
    g.addColorStop(0, rgb(pal.skyT)); g.addColorStop(1, rgb(pal.skyB));
    ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);

    const elev = Math.cos(Math.PI * 2 * st.p);
    // stars
    const sa = clamp(-elev * 1.8, 0, 1);
    if (sa > 0) {
      for (const s of stars) {
        const a = sa * (0.55 + 0.45 * Math.sin(t * 2 + s.tw));
        ctx.fillStyle = `rgba(255,250,235,${a.toFixed(3)})`;
        ctx.beginPath(); ctx.arc(s.x * VW, s.y * GY, s.r, 0, 6.283); ctx.fill();
      }
    }
    // sun
    const horizon = GY - 120;
    const sx = VW * (0.5 + 0.42 * Math.sin(Math.PI * 2 * st.p));
    const sy = horizon - elev * (horizon - 70);
    if (elev > -0.25) {
      const warm = clamp(1 - elev * 1.6, 0, 1);
      const core = mix([255, 246, 214], [255, 170, 90], warm);
      const glow = ctx.createRadialGradient(sx, sy, 10, sx, sy, 120);
      glow.addColorStop(0, rgb(core, 0.55)); glow.addColorStop(1, rgb(core, 0));
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(sx, sy, 120, 0, 6.283); ctx.fill();
      ctx.fillStyle = rgb(core); ctx.beginPath(); ctx.arc(sx, sy, 30, 0, 6.283); ctx.fill();
    }
    // moon
    const me = -elev;
    if (me > -0.25) {
      const mx = VW * (0.5 - 0.42 * Math.sin(Math.PI * 2 * st.p));
      const my = horizon - me * (horizon - 80);
      const glow = ctx.createRadialGradient(mx, my, 8, mx, my, 80);
      glow.addColorStop(0, "rgba(220,230,255,.35)"); glow.addColorStop(1, "rgba(220,230,255,0)");
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(mx, my, 80, 0, 6.283); ctx.fill();
      ctx.fillStyle = "#eef0e6"; ctx.beginPath(); ctx.arc(mx, my, 22, 0, 6.283); ctx.fill();
      ctx.fillStyle = "rgba(170,175,170,.55)";
      [[-7, -5, 5], [6, 4, 4], [-2, 9, 3], [8, -8, 2.5]].forEach(([a, b, r]) => { ctx.beginPath(); ctx.arc(mx + a, my + b, r, 0, 6.283); ctx.fill(); });
    }
  }

  function drawClouds(t) {
    const span = VW + 500;
    const ca = 0.92 - night * 0.45;
    ctx.fillStyle = rgb(pal.cloud, ca.toFixed(3));
    for (const c of clouds) {
      let x = (c.x - st.dist * 0.08 - t * 8) % span; if (x < -250) x += span;
      const y = c.y * GY, s = c.s;
      ctx.beginPath();
      ctx.ellipse(x, y, 60 * s, 18 * s, 0, 0, 6.283);
      ctx.ellipse(x - 30 * s, y + 2 * s, 30 * s, 16 * s, 0, 0, 6.283);
      ctx.ellipse(x + 8 * s, y - 14 * s, 34 * s, 22 * s, 0, 0, 6.283);
      ctx.ellipse(x + 38 * s, y - 2 * s, 28 * s, 16 * s, 0, 0, 6.283);
      ctx.fill();
    }
  }

  function drawBirds(t, dt) {
    const a = 1 - night;
    if (a <= 0.05) return;
    ctx.strokeStyle = `rgba(40,45,55,${(a * 0.7).toFixed(3)})`; ctx.lineWidth = 1.8; ctx.lineCap = "round";
    const span = VW + 200;
    for (const b of birds) {
      b.x -= (st.mode === "play" ? st.speed * 0.25 : 30) * dt + 22 * dt;
      if (b.x < -100) b.x += span;
      const y = b.y * GY + Math.sin(t * 0.8 + b.ph) * 8, f = Math.sin(t * 9 + b.ph) * 5;
      ctx.beginPath(); ctx.moveTo(b.x - 8, y - f); ctx.quadraticCurveTo(b.x - 3, y - 2, b.x, y); ctx.quadraticCurveTo(b.x + 3, y - 2, b.x + 8, y - f); ctx.stroke();
    }
  }

  function drawRidge(L, col) {
    const off = st.dist * L.f;
    ctx.fillStyle = rgb(col);
    ctx.beginPath(); ctx.moveTo(0, VH);
    for (let sx = 0; sx <= VW + 8; sx += 8) ctx.lineTo(sx, ry(L, sx + off));
    ctx.lineTo(VW, VH); ctx.closePath(); ctx.fill();
  }

  function pine(x, y, s, c, c2) {
    ctx.fillStyle = c2; ctx.fillRect(x - 2 * s, y - 8 * s, 4 * s, 9 * s);
    ctx.fillStyle = c;
    for (let i = 0; i < 3; i++) {
      const by = y - 6 * s - i * 13 * s, w = (17 - i * 4) * s;
      ctx.beginPath(); ctx.moveTo(x - w, by); ctx.lineTo(x, by - 22 * s); ctx.lineTo(x + w, by); ctx.closePath(); ctx.fill();
    }
  }
  function leafy(x, y, s, c, c2) {
    ctx.fillStyle = c2; ctx.fillRect(x - 2.5 * s, y - 16 * s, 5 * s, 17 * s);
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.arc(x, y - 30 * s, 15 * s, 0, 6.283);
    ctx.arc(x - 11 * s, y - 22 * s, 11 * s, 0, 6.283);
    ctx.arc(x + 11 * s, y - 23 * s, 12 * s, 0, 6.283);
    ctx.fill();
  }

  function drawTreeRidge() {
    const L = LAYERS.ridge, off = st.dist * L.f, sp = 36;
    const c = rgb(pal.tree), cl = rgb(mix(pal.tree, pal.ridge, 0.35)), trunk = rgb(mix(pal.tree, pal.dirt, 0.5));
    const i0 = Math.floor((off - 60) / sp), i1 = Math.floor((off + VW + 60) / sp);
    for (let i = i0; i <= i1; i++) {
      if (hash(i) < 0.28) continue;
      const wx = i * sp + hash(i + 0.5) * 18, sx = wx - off, s = 0.7 + hash(i + 0.9) * 0.7;
      const y = ry(L, wx) + 6, col = hash(i + 0.7) < 0.5 ? c : cl;
      hash(i + 0.3) < 0.6 ? pine(sx, y, s, col, trunk) : leafy(sx, y, s, col, trunk);
    }
    drawRidge(L, pal.ridge);
  }

  function drawNearTrees() {
    const f = 0.78, off = st.dist * f, sp = 230;
    const c = rgb(mix(pal.tree, pal.grassD, 0.25)), trunk = rgb(mix(pal.dirt, pal.tree, 0.3));
    const i0 = Math.floor((off - 200) / sp), i1 = Math.floor((off + VW + 200) / sp);
    for (let i = i0; i <= i1; i++) {
      if (hash(i + 40) < 0.45) continue;
      const sx = i * sp + hash(i + 41) * 120 - off, s = 1.6 + hash(i + 42) * 0.8;
      hash(i + 43) < 0.5 ? pine(sx, GY + 4, s, c, trunk) : leafy(sx, GY + 4, s, c, trunk);
    }
  }

  function drawGround() {
    ctx.fillStyle = rgb(pal.dirt); ctx.fillRect(0, GY + 8, VW, VH - GY);
    // pebbles
    const off = st.dist, sp = 26;
    ctx.fillStyle = rgb(mix(pal.dirt, [0, 0, 0], 0.22));
    for (let i = Math.floor(off / sp) - 1, e = Math.floor((off + VW) / sp) + 1; i <= e; i++) {
      if (hash(i + 900) < 0.5) continue;
      const x = i * sp - off + hash(i + 901) * 20, y = GY + 20 + hash(i + 902) * (VH - GY - 30);
      ctx.beginPath(); ctx.ellipse(x, y, 2 + hash(i + 903) * 3, 1.4 + hash(i + 904) * 1.6, 0, 0, 6.283); ctx.fill();
    }
    // grass band
    const g = ctx.createLinearGradient(0, GY - 4, 0, GY + 18);
    g.addColorStop(0, rgb(pal.grass)); g.addColorStop(1, rgb(pal.grassD));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(0, GY + 18);
    for (let sx = 0; sx <= VW + 10; sx += 10) ctx.lineTo(sx, GY + 14 + Math.sin((sx + off) * 0.09) * 2.5);
    ctx.lineTo(VW, GY - 2); ctx.lineTo(0, GY - 2); ctx.closePath(); ctx.fill();
    // tufts
    const tsp = 11;
    ctx.strokeStyle = rgb(pal.grassD); ctx.lineWidth = 2; ctx.lineCap = "round";
    ctx.beginPath();
    for (let i = Math.floor(off / tsp) - 1, e = Math.floor((off + VW) / tsp) + 1; i <= e; i++) {
      const x = i * tsp - off + hash(i + 500) * 6, h = 4 + hash(i + 501) * 8;
      ctx.moveTo(x, GY); ctx.lineTo(x - 3, GY - h);
      ctx.moveTo(x + 2, GY); ctx.lineTo(x + 4, GY - h * 0.8);
    }
    ctx.stroke();
    // wildflowers
    const fcols = ["#fff6e0", "#ffd84d", "#f39ab4", "#b9a6ff"];
    for (let i = Math.floor(off / tsp) - 1, e = Math.floor((off + VW) / tsp) + 1; i <= e; i++) {
      if (hash(i + 600) < 0.86) continue;
      const x = i * tsp - off + 3, h = 9 + hash(i + 601) * 6;
      ctx.strokeStyle = rgb(pal.grassD); ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(x, GY + 2); ctx.lineTo(x, GY - h); ctx.stroke();
      ctx.fillStyle = sh(fcols[(hash(i + 602) * 4) | 0]);
      ctx.beginPath(); ctx.arc(x, GY - h, 2.6, 0, 6.283); ctx.fill();
    }
  }

  function drawObstacle(o) {
    const x = o.x, w = o.w, h = o.h, y = GY;
    // contact shadow
    ctx.fillStyle = "rgba(20,25,15,.22)";
    ctx.beginPath(); ctx.ellipse(x + w / 2, y + 1, w * 0.55, 4, 0, 0, 6.283); ctx.fill();
    if (o.type === "log") {
      const r = h / 2;
      ctx.fillStyle = sh("#7a4b2a");
      ctx.beginPath(); ctx.moveTo(x + r, y - h); ctx.lineTo(x + w - r, y - h); ctx.arc(x + w - r, y - r, r, -Math.PI / 2, Math.PI / 2); ctx.lineTo(x + r, y); ctx.arc(x + r, y - r, r, Math.PI / 2, Math.PI * 1.5); ctx.fill();
      ctx.strokeStyle = sh("#5a351c"); ctx.lineWidth = 2; ctx.lineCap = "round";
      ctx.beginPath();
      for (let i = 0; i < 4; i++) { const bx = x + r + (w - 2 * r) * (0.15 + i * 0.22); ctx.moveTo(bx, y - h + 6); ctx.lineTo(bx + 10, y - h + 6 + (i % 2 ? 9 : 5)); }
      ctx.stroke();
      ctx.fillStyle = sh("#d2a46b"); ctx.beginPath(); ctx.ellipse(x + w - r, y - r, r * 0.62, r * 0.92, 0, 0, 6.283); ctx.fill();
      ctx.strokeStyle = sh("#a87a46"); ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.ellipse(x + w - r, y - r, r * 0.38, r * 0.58, 0, 0, 6.283); ctx.moveTo(x + w - r + r * 0.15, y - r); ctx.ellipse(x + w - r, y - r, r * 0.15, r * 0.25, 0, 0, 6.283); ctx.stroke();
      ctx.fillStyle = sh("#5f8f3a"); ctx.beginPath(); ctx.ellipse(x + w * 0.35, y - h + 1, 9, 3.5, 0, 0, 6.283); ctx.fill();
    } else if (o.type === "rock") {
      ctx.fillStyle = sh("#878b86");
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w * 0.08, y - h * 0.55); ctx.lineTo(x + w * 0.32, y - h); ctx.lineTo(x + w * 0.7, y - h * 0.92); ctx.lineTo(x + w * 0.95, y - h * 0.45); ctx.lineTo(x + w, y); ctx.closePath(); ctx.fill();
      ctx.fillStyle = sh("#a6aaa3");
      ctx.beginPath(); ctx.moveTo(x + w * 0.12, y - h * 0.55); ctx.lineTo(x + w * 0.32, y - h); ctx.lineTo(x + w * 0.62, y - h * 0.9); ctx.lineTo(x + w * 0.42, y - h * 0.55); ctx.closePath(); ctx.fill();
      ctx.fillStyle = sh("#6b6f6a");
      ctx.beginPath(); ctx.moveTo(x + w * 0.7, y - h * 0.92); ctx.lineTo(x + w * 0.95, y - h * 0.45); ctx.lineTo(x + w, y); ctx.lineTo(x + w * 0.72, y); ctx.closePath(); ctx.fill();
      ctx.fillStyle = sh("#6e9a45"); ctx.beginPath(); ctx.ellipse(x + w * 0.45, y - h * 0.94, 8, 3, -0.15, 0, 6.283); ctx.fill();
    } else {
      ctx.fillStyle = sh("#6e4426");
      ctx.beginPath(); ctx.moveTo(x - 6, y); ctx.quadraticCurveTo(x + 2, y - 6, x + 2, y - h); ctx.lineTo(x + w - 2, y - h); ctx.quadraticCurveTo(x + w - 2, y - 6, x + w + 6, y); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = sh("#53311a"); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x + w * 0.3, y - h + 8); ctx.lineTo(x + w * 0.28, y - 8); ctx.moveTo(x + w * 0.68, y - h + 12); ctx.lineTo(x + w * 0.7, y - 6); ctx.stroke();
      ctx.fillStyle = sh("#cf9d63"); ctx.beginPath(); ctx.ellipse(x + w / 2, y - h, w / 2 - 2, 6, 0, 0, 6.283); ctx.fill();
      ctx.strokeStyle = sh("#a7743f"); ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.ellipse(x + w / 2, y - h, w / 4, 3, 0, 0, 6.283); ctx.stroke();
    }
  }

  function drawBerry(b, t) {
    const y = GY - b.h + Math.sin(t * 4 + b.ph) * 3;
    if (b.kind === "rasp") {
      ctx.fillStyle = sh("#d3324b"); ctx.beginPath(); ctx.arc(b.x, y, 8, 0, 6.283); ctx.fill();
      ctx.fillStyle = sh("#ef6a7c");
      [[-3, -2], [2, -3], [3, 2], [-2, 3], [0, 0]].forEach(([a, c]) => { ctx.beginPath(); ctx.arc(b.x + a, y + c, 1.6, 0, 6.283); ctx.fill(); });
    } else {
      ctx.fillStyle = sh("#3d4fa8"); ctx.beginPath(); ctx.arc(b.x, y, 7.5, 0, 6.283); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.45)"; ctx.beginPath(); ctx.arc(b.x - 2.5, y - 2.5, 2.2, 0, 6.283); ctx.fill();
      ctx.fillStyle = sh("#27306a"); ctx.beginPath(); ctx.arc(b.x, y - 6, 1.8, 0, 6.283); ctx.fill();
    }
    ctx.fillStyle = sh("#4f8f35");
    ctx.beginPath(); ctx.ellipse(b.x + 3, y - 9, 4.5, 2, -0.5, 0, 6.283); ctx.fill();
  }

  function leg(x, y, ang, len, col) {
    ctx.strokeStyle = col; ctx.lineWidth = 5; ctx.lineCap = "round";
    const kx = x + Math.sin(ang) * len * 0.55, ky = y + Math.cos(ang) * len * 0.55;
    const fx = kx + Math.sin(ang * 0.4) * len * 0.5, fy = ky + Math.cos(ang * 0.4) * len * 0.5;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();
  }

  function drawFox(t) {
    const air = !fox.ground && st.mode === "play";
    const ph = fox.run;
    const feet = GY + fox.y;
    const bob = air ? 0 : -Math.abs(Math.sin(ph)) * 2.5;
    const fur = sh("#d9692b"), furD = sh("#a8461b"), cream = sh("#f7e8d2"), dark = sh("#3a2417"), darkB = sh("#2a190f");

    // ground shadow shrinks with height
    const hs = clamp(1 + fox.y / 220, 0.35, 1);
    ctx.fillStyle = `rgba(20,25,15,${(0.25 * hs).toFixed(3)})`;
    ctx.beginPath(); ctx.ellipse(fox.x + 4, GY + 2, 30 * hs, 4.5 * hs, 0, 0, 6.283); ctx.fill();

    ctx.save();
    ctx.translate(fox.x, feet);
    const sq = fox.squash;
    ctx.scale(1 + sq * 0.12, 1 - sq * 0.12);
    ctx.translate(0, bob);
    if (air) ctx.rotate(clamp(fox.vy / 2600, -0.22, 0.25));

    // far legs
    if (air) { leg(16, -18, 0.9, 17, darkB); leg(-14, -18, -0.9, 17, darkB); }
    else { leg(16, -18, Math.sin(ph + Math.PI) * 0.75, 17, darkB); leg(-14, -18, Math.sin(ph) * 0.75, 17, darkB); }

    // tail
    const wag = Math.sin(ph * 0.5) * 4;
    ctx.fillStyle = fur;
    ctx.beginPath(); ctx.moveTo(-18, -30);
    ctx.quadraticCurveTo(-42, -52 + wag, -64, -36 + wag);
    ctx.quadraticCurveTo(-46, -18 + wag * 0.5, -18, -22);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = cream;
    ctx.beginPath(); ctx.ellipse(-60, -35 + wag, 8, 6, -0.3, 0, 6.283); ctx.fill();

    // body
    ctx.fillStyle = fur; ctx.beginPath(); ctx.ellipse(0, -28, 27, 13, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = furD; ctx.beginPath(); ctx.ellipse(-6, -36, 18, 4, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = cream; ctx.beginPath(); ctx.ellipse(8, -20, 15, 5.5, 0, 0, 6.283); ctx.fill();

    // near legs
    if (air) { leg(20, -18, 1.05, 17, dark); leg(-10, -18, -1.0, 17, dark); }
    else { leg(20, -18, Math.sin(ph) * 0.75, 17, dark); leg(-10, -18, Math.sin(ph + Math.PI) * 0.75, 17, dark); }

    // neck + head
    ctx.fillStyle = fur; ctx.beginPath(); ctx.ellipse(20, -34, 11, 10, -0.4, 0, 6.283); ctx.fill();
    ctx.fillStyle = furD; ctx.beginPath(); ctx.moveTo(18, -46); ctx.lineTo(21, -59); ctx.lineTo(26, -47); ctx.closePath(); ctx.fill();
    ctx.fillStyle = fur; ctx.beginPath(); ctx.arc(29, -40, 11, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.moveTo(34, -45); ctx.lineTo(50, -37); ctx.lineTo(34, -33); ctx.closePath(); ctx.fill();
    ctx.fillStyle = cream; ctx.beginPath(); ctx.moveTo(24, -37); ctx.lineTo(49, -36); ctx.lineTo(33, -29); ctx.closePath(); ctx.fill();
    ctx.fillStyle = fur; ctx.beginPath(); ctx.moveTo(25, -47); ctx.lineTo(29, -62); ctx.lineTo(34, -47); ctx.closePath(); ctx.fill();
    ctx.fillStyle = dark; ctx.beginPath(); ctx.moveTo(27, -54); ctx.lineTo(29, -62); ctx.lineTo(31.5, -54); ctx.closePath(); ctx.fill();
    ctx.fillStyle = darkB; ctx.beginPath(); ctx.arc(50, -37, 2.6, 0, 6.283); ctx.fill();
    if (st.mode === "over") {
      ctx.strokeStyle = darkB; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(31, -45); ctx.lineTo(36, -40); ctx.moveTo(36, -45); ctx.lineTo(31, -40); ctx.stroke();
    } else {
      ctx.fillStyle = darkB; ctx.beginPath(); ctx.arc(34, -42, 2.2, 0, 6.283); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.beginPath(); ctx.arc(34.7, -42.8, 0.8, 0, 6.283); ctx.fill();
    }
    ctx.restore();
  }

  function drawFireflies(t) {
    if (night < 0.15) return;
    for (const f of flies) {
      const x = ((f.x * VW * 1.3 - st.dist * 0.6 + Math.sin(t * f.sp + f.ph) * 20) % (VW + 60) + VW + 60) % (VW + 60) - 30;
      const y = GY - 20 - f.y * 130 + Math.cos(t * f.sp * 1.3 + f.ph) * 10;
      const a = night * clamp(0.5 + 0.5 * Math.sin(t * 3 * f.sp + f.ph * 3), 0, 1);
      const g = ctx.createRadialGradient(x, y, 0, x, y, 9);
      g.addColorStop(0, `rgba(255,240,140,${a.toFixed(3)})`); g.addColorStop(1, "rgba(255,240,140,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 9, 0, 6.283); ctx.fill();
    }
  }

  function draw(t, dt) {
    updatePalette(st.p);
    night = clamp(-Math.cos(Math.PI * 2 * st.p) * 1.6, 0, 1);
    ctx.setTransform(DPR * S, 0, 0, DPR * S, 0, 0);
    if (st.shake > 0) ctx.translate(rand(-st.shake, st.shake) * 0.4, rand(-st.shake, st.shake) * 0.4);

    drawSky(t);
    drawClouds(t);
    drawBirds(t, dt);
    drawRidge(LAYERS.far, pal.far);
    drawRidge(LAYERS.far2, pal.far2);
    drawRidge(LAYERS.hill, pal.hill);
    drawTreeRidge();
    drawNearTrees();
    drawGround();
    for (const b of berries) drawBerry(b, t);
    for (const o of obstacles) drawObstacle(o);
    drawFox(t);
    for (const p of parts) {
      ctx.globalAlpha = 1 - p.life / p.max;
      ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
    drawFireflies(t);
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw(now / 1000, dt);
    requestAnimationFrame(frame);
  }

  // ---------- input ----------
  const JUMP_KEYS = new Set(["Space", "ArrowUp", "KeyW"]);
  window.addEventListener("keydown", (e) => {
    if (JUMP_KEYS.has(e.code)) { e.preventDefault(); if (!e.repeat) press(); }
    else if (e.code === "KeyP" || e.code === "Escape") setPaused(st.mode === "play");
    else if (e.code === "KeyM") toggleMute();
  });
  window.addEventListener("keyup", (e) => { if (JUMP_KEYS.has(e.code)) release(); });
  cv.addEventListener("pointerdown", (e) => { e.preventDefault(); press(); });
  window.addEventListener("pointerup", release);
  window.addEventListener("pointercancel", release);
  $("playBtn").addEventListener("click", () => startRun());
  $("againBtn").addEventListener("click", () => startRun());
  $("resumeBtn").addEventListener("click", () => setPaused(false));
  $("pause").addEventListener("click", () => setPaused(st.mode === "play"));
  function toggleMute() { muted = !muted; $("mute").setAttribute("aria-pressed", String(muted)); }
  $("mute").addEventListener("click", toggleMute);
  document.addEventListener("visibilitychange", () => { if (document.hidden) setPaused(true); });
  window.addEventListener("resize", resize);

  resize();
  requestAnimationFrame((t) => { last = t; frame(t); });
})();
</script>
</body>
</html>
